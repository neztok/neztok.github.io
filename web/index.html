<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Presentation</title>
    <base href="./">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="compact" data-zoom="1.1">
      <div id="connectionBadge" class="connection-badge" data-stage="disconnected">未接続</div>
      <header id="titleBar">
        <div class="title-text" id="questionTitle"></div>
        <div class="status-text" id="statusHint"></div>
      </header>
      <main id="presentation">
        <div id="contentShell">
          <div id="content"></div>
          <div id="pageIndicator"></div>
        </div>
        <div id="overlayFlash"></div>
      </main>
      <aside id="answerPanel">
        <h2>正解</h2>
        <p id="answers"></p>
        <div id="explain"></div>
      </aside>
      <div id="preloadStatus" class="preload-status hidden">
        <div class="preload-card">
          <div class="preload-title">音声を準備しています…</div>
          <div class="preload-bar">
            <div id="preloadBarFill" class="preload-bar-fill"></div>
          </div>
          <div class="preload-meta">
            <span id="preloadPercent">0%</span>
            <span id="preloadCount">0/0</span>
          </div>
          <div id="preloadPreview" class="preload-preview"></div>
          <div id="preloadMessage" class="preload-message"></div>
          <button id="preloadForceButton" type="button" class="preload-force hidden">それでも開始</button>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
