<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Presentation</title>
    <base href="./" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" data-zoom="1.0" class="compact">
      <div id="connectionBadge" class="connection-badge" data-stage="disconnected">未接続</div>
      <header class="header">
        <div class="title" id="questionTitle"></div>
        <div class="status" id="statusHint"></div>
      </header>
      <main class="stage">
        <div id="contentShell" class="content-shell">
          <div id="content" class="content"></div>
          <div id="readyGate" class="ready-gate">
            <div class="ready-card">クリックまたはキー操作で開始</div>
          </div>
        </div>
        <div id="pageIndicator" class="page-indicator">0/0</div>
      </main>
      <footer class="footer">
        <div id="interactionHint">クリックまたはキー操作で開始できます</div>
        <div id="buildInfo" class="build-info"></div>
      </footer>
      <div id="answerOverlay" class="answer-overlay" aria-hidden="true">
        <div class="answer-card">
          <h2>正解</h2>
          <p id="answers"></p>
          <div id="explain"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
